# NVIDIA 加速模式（AMD64）
services:
  ffpanel:
    container_name: ffpanel
    image: ghcr.io/smy116/ffpanel:latest
    restart: unless-stopped
    platform: linux/amd64
    environment:
      FFPANEL_HOST: "0.0.0.0"
      FFPANEL_PORT: "8090"
      FFPANEL_CONFIG_DIR: "/config"
      FFPANEL_CACHE_DIR: "/cache"
      FFPANEL_LOCAL_ROOTS: "/media"
      FFPANEL_RCLONE_CONFIG: "/config/rclone/rclone.conf"
      FFPANEL_FFMPEG_PATH: "ffmpeg"
      FFPANEL_FFPROBE_PATH: "ffprobe"
      FFPANEL_RCLONE_PATH: "rclone"
      FFPANEL_AUTH_ENABLED: "false"
      FFPANEL_AUTH_USERNAME: ""
      FFPANEL_AUTH_PASSWORD: ""
      FFPANEL_LOG_LEVEL: "INFO"
      FFPANEL_NVIDIA_DEVICE: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    ports:
      - "8090:8090"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media
    stop_grace_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_GPU_ID:-0}"]
              capabilities: [gpu]
